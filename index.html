/* ================= 布局尺寸 ================= */
function baseFont(){document.body.style.fontSize=Math.max(12,Math.round(window.innerWidth/26))+'px';}
function sizeClock(){
  var H=Math.round(window.innerHeight*0.29);var W=Math.min(Math.ceil(H*0.88*0.74),Math.min(Math.round(H*0.66),Math.floor((window.innerWidth*0.88-Math.round(H*0.20))/4.35)));
  var cards=document.getElementsByClassName('card');
  for(var i=0;i<cards.length;i++){
    cards[i].style.height=H+'px';cards[i].style.width=W+'px';
    var F=Math.round(H*0.88),PT=0;
    var sp=cards[i].getElementsByTagName('span');
    for(var j=0;j<sp.length;j++){
      sp[j].style.lineHeight='normal';
      sp[j].style.fontSize=F+'px';
      sp[j].style.paddingTop=PT+'px';
    }
  }
  var col=$('colon');
  var FC=Math.round(H*0.55);
  col.style.lineHeight='normal';
  col.style.fontSize=FC+'px';
  col.style.paddingTop=Math.max(0,Math.round((H-FC*1.09)/2))+'px';
  col.style.width=Math.round(H*0.20)+'px';
  $('clock').style.marginTop='0px';
}

/* ================= 时钟 ================= */
var lastStr='';
function initClock(){
  var d=nowL();var s=pad(d.getUTCHours())+pad(d.getUTCMinutes());lastStr=s;
  for(var i=0;i<4;i++){
    var c=$('c'+i);
    var sp=c.getElementsByTagName('span');
    if(sp.length){sp[0].innerHTML=s.charAt(i);} /* 保留尺寸样式，只换数字 */
    else{c.innerHTML='<span>'+s.charAt(i)+'</span>';}
  }
}
function setDigit(card,val){
  if(!card){return;}
  var sp=card.getElementsByTagName('span')[0];
  if(sp&&sp.innerHTML!==val){sp.innerHTML=val;}
}
function tick(){
  var d=nowL();
  var s=pad(d.getUTCHours())+pad(d.getUTCMinutes());
  if(s!==lastStr){for(var i=0;i<4;i++){setDigit($('c'+i),s.charAt(i));}lastStr=s;}
  if(BLINK){$('colon').style.visibility=(d.getUTCSeconds()%2===0)?'visible':'hidden';}
}

71:'小雪',73:'中雪',75:'大雪',77:'雪粒',80:'阵雨',81:'阵雨',82:'强阵雨',
85:'阵雪',86:'强阵雪',95:'雷阵雨',96:'雷暴冰雹',99:'雷暴冰雹'};
function xhr(url,ok,err){
  var x=new XMLHttpRequest();
  x.onreadystatechange=function(){if(x.readyState===4){if(x.status===200){ok(x.responseText);}else{err();}}};
  try{x.timeout=15000;x.ontimeout=err;}catch(e){}
  x.open('GET',url,true);x.send(null);
}
function loadWeather(){
  var city=P.city||'广州';
  $('wx').innerHTML='正在获取「'+city+'」天气…';
  var fail=function(){$('wx').innerHTML='天气暂时不可用（请检查网络，或用 ?city=城市 指定）';};
  xhr('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=zh&format=json',
    function(t){
      try{
        var g=JSON.parse(t);
        if(g.results&&g.results.length){
          var r=g.results[0];lsSet('kw_city',r.name);
          var u='https://api.open-meteo.com/v1/forecast?latitude='+r.latitude+
            '&longitude='+r.longitude+
            '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m'+
            '&timezone=auto&forecast_days=1';
          xhr(u,function(t2){
            try{
              var j2=JSON.parse(t2);
              if(j2.utc_offset_seconds!=null){TZ_OFF_MS=j2.utc_offset_seconds*1000;refreshAll();}
              var c=j2.current;
              var txt=WX_TXT[c.weather_code];if(!txt){txt='天气'+(c.weather_code!=null?c.weather_code:'');}
              $('wx').innerHTML=r.name+' '+txt+' '+Math.round(c.temperature_2m)+'°C'+
                '（体感'+Math.round(c.apparent_temperature)+'°）<br>'+
                '湿度'+Math.round(c.relative_humidity_2m)+'% · 风速'+Math.round(c.wind_speed_10m)+'km/h'+
                ' · '+pad(nowL().getUTCHours())+':'+pad(nowL().getUTCMinutes())+'更新';
            }catch(e){fail();}
          },fail);
        }else{$('wx').innerHTML='未找到城市：'+city;}
      }catch(e){fail();}
    },fail);
}

/* ================= 假期数据（官方公布） ================= */
/* 2026 年依据：国办发明电〔2025〕7 号；2025 年依据国办发明电〔2024〕12 号 */
var HOLIDAY_TABLE={};
function addRange(s,e,name){
  var y=+s.slice(0,4),m=+s.slice(5,7),d=+s.slice(8,10);
  var end=new Date(+e.slice(0,4),+e.slice(5,7)-1,+e.slice(8,10));
  var cur=new Date(y,m-1,d);
  while(cur<=end){HOLIDAY_TABLE[cur.getFullYear()+'-'+pad(cur.getMonth()+1)+'-'+pad(cur.getDate())]={n:name,w:0};cur.setDate(cur.getDate()+1);}
}
function addWork(list){for(var i=0;i<list.length;i++){HOLIDAY_TABLE[list[i]]={n:'',w:1};}}
addRange('2025-01-01','2025-01-01','元旦');
addRange('2025-01-28','2025-02-04','春节');
addRange('2025-04-04','2025-04-06','清明节');
addRange('2025-05-01','2025-05-05','劳动节');
addRange('2025-05-31','2025-06-02','端午节');
addRange('2025-10-01','2025-10-08','国庆节·中秋');

function holidayInfo(y,m,d){
  var t=HOLIDAY_TABLE[y+'-'+pad(m)+'-'+pad(d)];
  if(t){return t;}
  if(typeof HolidayUtil!=='undefined'){
    try{var h=HolidayUtil.getHoliday(y,m,d);
      if(h){return {n:h.getName(),w:h.isWork()?1:0};}
    }catch(e){}
  }
  return null;
}

/* ================= 月历 ================= */
function buildCalendar(){
  var now=nowL(),y=now.getUTCFullYear(),m=now.getUTCMonth();
  var startDow=(new Date(Date.UTC(y,m,1)).getUTCDay()+6)%7; /* 周一=0 */
  var days=new Date(y,m+1,0).getDate();
  $('calHead').innerHTML=y+' 年 '+(m+1)+' 月';
  var html='<tr><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>日</th></tr>';
  var d=1,rows=Math.ceil((startDow+days)/7),luOK=(typeof Solar!=='undefined');
  for(var r=0;r<rows;r++){
    html+='<tr>';
    for(var c=0;c<7;c++){
      var idx=r*7+c;
      if(idx<startDow||d>days){html+='<td></td>';continue;}
      var dd=d++,cls='',label='',lunar='';
      if(luOK){
        try{
          var lu=Solar.fromYmd(y,m+1,dd).getLunar();
          lunar=(lu.getDay()===1)?(lu.getMonthInChinese()+'月'):lu.getDayInChinese();
          var fs=lu.getFestivals();
          if(fs&&fs.length){label=fs[0];}
          else{var ofs=lu.getOtherFestivals();if(ofs&&ofs.length){label=ofs[0];}}
        }catch(e){}
      }
      var hol=holidayInfo(y,m+1,dd);
      if(hol&&hol.n){label=hol.n;}
      if(hol&&hol.w){label='班 '+label;}
      if(dd===now.getUTCDate()){cls='today';}
      else if(hol&&!hol.w){cls='hol';}
      else if(c>=5){cls='wknd';}
      html+='<td class="'+cls+'"><div class="d">'+dd+'</div><div class="l">'+(label||lunar||'&nbsp;')+'</div></td>';
    }
    html+='</tr>';
  }
  $('cal').innerHTML=html;
}

/* ================= 黄历 + 日期行 ================= */
function buildDateLine(){
  var d=nowL();
  var wk='日一二三四五六'.charAt(d.getUTCDay());
  $('dateLine').innerHTML=(d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日 星期'+wk;
}
function buildFoot(){
  if(typeof Solar==='undefined'){$('foot').innerHTML='';return;}
  try{
    var nd=nowL();
    var lu=Solar.fromYmd(nd.getUTCFullYear(),nd.getUTCMonth()+1,nd.getUTCDate()).getLunar();
    var yi=lu.getDayYi(),ji=lu.getDayJi();
    $('foot').innerHTML=
      '农历'+lu.getYearInChinese()+'年'+lu.getMonthInChinese()+'月'+lu.getDayInChinese()+
      ' · '+lu.getYearInGanZhi()+'（'+lu.getYearShengXiao()+'）年 星期'+lu.getWeekInChinese()+'<br>'+
      '<b>宜</b> '+yi.slice(0,5).join(' ')+'<br><b>忌</b> '+ji.slice(0,5).join(' ');
  }catch(e){$('foot').innerHTML='';}
}
