<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="300">
<style>
  body { font-family: sans-serif; background:#fff; color:#000;
         text-align:center; margin:6px 8px; }
  /* 顶部星期+农历 */
  #topline { font-size:19px; color:#333; }
  /* 大时钟：黑色数字 */
  #clock { font-size:95px; font-weight:bold; letter-spacing:4px;
           margin-top:5px; line-height:1.1; }
  /* 天气行 */
  #weather { font-size:21px; margin-top:6px; min-height:26px; }
  /* 月历 */
  #cal-title { font-size:22px; font-weight:bold; margin-top:7px; }
  table.cal { width:100%; border-collapse:collapse; margin-top:4px; table-layout:fixed; }
  table.cal th { font-size:15px; padding:0; font-weight:bold; }
  table.cal td { border:1px solid #000; height:45px; vertical-align:top;
                 padding:1px 2px; text-align:left; overflow:hidden; }
  .dnum { font-size:19px; font-weight:bold; }
  .lunar { font-size:12px; color:#333; }
  .tag { font-size:11px; background:#000; color:#fff; border-radius:4px; padding:0 2px; }
  td.we { background:#eee; }
  td.today { background:#000; color:#fff; }
  td.today .lunar { color:#bbb; }
  /* 简易黄历 */
  #hl { font-size:17px; margin-top:7px; }
</style>
</head>
<body>
  <div id="topline"></div>
  <div id="clock">--:--</div>
  <div id="weather">天气加载中...</div>
  <div id="cal-title"></div>
  <table class="cal" id="cal"></table>
  <div id="hl"></div>

<script>
  // ====== 只需要改这两行城市名 ======
  var CITY = "guangzhou";   // 查询天气用，保持拼音
  var CITY_CN = "广州";   // 页面上显示用，写中文名
  // =================================
  var weekName = ["一","二","三","四","五","六","日"];
  function p2(n){ return ("0"+n).slice(-2); }

  // 英文天气 → 中文对照表
  var wxZh = {
    "Sunny":"晴", "Clear":"晴", "Partly cloudy":"多云",
    "Partly Cloudy":"多云", "Cloudy":"阴", "Overcast":"阴",
    "Mist":"薄雾", "Fog":"雾", "Freezing fog":"冻雾",
    "Patchy rain possible":"局部有雨", "Patchy light rain":"零星小雨",
    "Light rain":"小雨", "Light rain shower":"小阵雨",
    "Moderate rain":"中雨", "Moderate or heavy rain shower":"中到大阵雨",
    "Heavy rain":"大雨", "Torrential rain":"暴雨",
    "Patchy snow possible":"局部有雪", "Light snow":"小雪",
    "Moderate snow":"中雪", "Heavy snow":"大雪",
    "Patchy sleet possible":"局部雨夹雪", "Light sleet":"雨夹雪",
    "Patchy light drizzle":"零星毛毛雨", "Light drizzle":"毛毛雨",
    "Patchy light snow":"零星小雪", "Thundery outbreaks possible":"可能有雷暴",
    "Moderate or heavy rain with thunder":"雷阵雨",
    "Blizzard":"暴风雪", "Blowing snow":"吹雪", "Ice pellets":"冰粒",
    "Rain":"雨", "Showers":"阵雨", "Drizzle":"毛毛雨", "Snow":"雪"
  };
  function zh(w){
    w = (w+"").trim();
    if (wxZh[w]) return wxZh[w];
    for (var k in wxZh){
      if (w.indexOf(k) >= 0) return wxZh[k];
    }
    return w;   // 没见过的词保持原样
  }

  // ---------- 时钟 ----------
  function tickClock(){
    var d = new Date();
    document.getElementById('clock').textContent =
      p2(d.getHours())+":"+p2(d.getMinutes());
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ---------- 天气（强制中文显示） ----------
  fetch("https://wttr.in/"+CITY+"?format=j1&lang=zh")
    .then(function(r){ return r.json(); })
    .then(function(d){
      var cur = d.current_condition[0];
      var t1 = d.weather[1];
      document.getElementById('weather').textContent =
        CITY_CN + " " + zh(cur.weatherDesc[0].value) + " " + cur.temp_C + "℃ ｜ 明天 " +
        zh(t1.dayweather) + " " + t1.nighttemp + "~" + t1.daytemp + "℃";
    })
    .catch(function(){
      document.getElementById('weather').textContent = "天气获取失败";
    });

  // ---------- 月历 ----------
  var now = new Date(), Y = now.getFullYear(), M = now.getMonth();
  document.getElementById('cal-title').textContent = Y+"年"+(M+1)+"月";
  var first = (new Date(Y, M, 1).getDay()+6)%7;   // 周一开头
  var daysInMonth = new Date(Y, M+1, 0).getDate();
  var html = '<tr><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>日</th></tr>';
  var day = 1;
  for (var r=0; r<6 && day<=daysInMonth; r++){
    html += '<tr>';
    for (var c=0; c<7; c++){
      var idx = r*7+c;
      if (idx < first || day > daysInMonth){
        html += '<td></td>';
      } else {
        var cls = '';
        if (day === now.getDate()) cls += 'today ';
        if (c >= 5) cls += 'we';
        html += '<td id="c'+day+'" class="'+cls+'">'+
                '<span class="dnum">'+day+'</span><br>'+
                '<span class="lunar">·</span></td>';
        day++;
      }
    }
    html += '</tr>';
  }
  document.getElementById('cal').innerHTML = html;

  // ---------- 逐日获取农历 / 假期 / 今日黄历 ----------
  for (var dd=1; dd<=daysInMonth; dd++){
    (function(day){
      fetch("https://api.vvhan.com/api/zh/calendar?date="+Y+"-"+p2(M+1)+"-"+p2(day))
        .then(function(r){ return r.json(); })
        .then(function(res){
          var d2 = (res && res.data) ? res.data : res;
          var cell = document.getElementById('c'+day);
          if (!cell || !d2) return;
          // 农历（截取“月”后面的部分：初一、初二…）
          var nl = d2.lunar_date || d2.nongli || d2.lunar || "";
          nl = (nl+"").replace(/^农历/, "");
          var lm = nl.match(/月(.+)$/);
          if (lm) nl = lm[1];
          if (nl) cell.querySelector('.lunar').textContent = nl;
          // 节假日标记
          var tag = d2.festival || d2.holiday_name || d2.holidayName || "";
          if (typeof tag !== "string") tag = "";
          if (tag && tag !== "无" && tag !== "null"){
            var s = document.createElement('span');
            s.className = 'tag'; s.textContent = tag;
            cell.appendChild(document.createElement('br'));
            cell.appendChild(s);
          }
          // 今天：顶部农历 + 底部黄历
          if (day === now.getDate()){
            document.getElementById('topline').textContent =
              "星期"+weekName[(now.getDay()+6)%7]+(nl ? " · 农历"+nl : "");
            var yi = (d2.yi || d2.suit || "").replace(/\s+/g, " ");
            var ji = (d2.ji || d2.taboo || "").replace(/\s+/g, " ");
            document.getElementById('hl').textContent =
              "宜 "+(yi||"—")+" ｜ 忌 "+(ji||"—");
          }
        })
        .catch(function(){});
    })(dd);
  }
</script>
</body>
</html>
